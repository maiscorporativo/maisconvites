<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Credenciamento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    :root {
      --azul: #002042;
      --azul-2: #0b3463;
      --laranja: #f7ad40;
      --laranja-escuro: #e84e27;
      --grad-marca: linear-gradient(135deg, var(--laranja) 0%, var(--laranja-escuro) 100%);
      --texto: #1d2a3c;
      --suave: #64748b;
      --fraco: #97a6b8;
      --borda: #e3eaf2;
      --borda-forte: #cdd8e4;
      --fundo: #f1f5f9;
      --painel: #ffffff;
      --linha-par: #f8fafd;
      --grupo: #eef3f9;
      --ok: #15803d;
      --ok-fundo: #e7f5ec;
      --ok-borda: #c3e5d0;
      --erro: #cf3a1a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: 'Inter', 'Segoe UI Variable Text', 'Segoe UI', system-ui, Arial, sans-serif;
      color: var(--texto); background: var(--fundo); font-size: 14px; line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Cabeçalho ── */
    .topo { background: var(--azul); color: #eef4fb; }
    .topo-int {
      max-width: 1100px; margin: 0 auto; padding: 14px 20px 16px;
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    }
    .topo img { height: 26px; }
    .topo .ev { flex: 1; min-width: 200px; }
    .topo .ev b { display: block; font-size: 17px; letter-spacing: -.01em; color: #fff; }
    .topo .ev span { font-size: 12.5px; color: #b9c8da; }
    .placar { text-align: right; min-width: 190px; }
    .placar .num { font-size: 22px; font-weight: 800; color: #fff; letter-spacing: -.02em; }
    .placar .num small { font-size: 13px; font-weight: 500; color: #b9c8da; }
    .barra-prog { height: 6px; background: rgba(255,255,255,.14); border-radius: 99px; overflow: hidden; margin-top: 6px; }
    .barra-prog div { height: 100%; width: 0; background: var(--grad-marca); border-radius: 99px; transition: width .35s ease; }

    /* ── Ferramentas (fixas no topo ao rolar) ── */
    .ferramentas {
      position: sticky; top: 0; z-index: 20; background: var(--fundo);
      border-bottom: 1px solid var(--borda);
    }
    .ferr-int {
      max-width: 1100px; margin: 0 auto; padding: 12px 20px;
      display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    }
    .busca { position: relative; flex: 1; min-width: 220px; }
    .busca svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; stroke: var(--suave); fill: none; stroke-width: 2; }
    .busca input {
      width: 100%; font: inherit; font-size: 16px; padding: 11px 40px 11px 40px;
      border: 1.5px solid var(--borda-forte); border-radius: 10px; background: #fff; color: var(--texto);
      outline: none; transition: border-color .15s, box-shadow .15s;
    }
    .busca input:focus { border-color: var(--laranja); box-shadow: 0 0 0 3px rgba(247,173,64,.25); }
    .busca .limpar {
      position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
      border: 0; background: none; color: var(--suave); font-size: 20px; line-height: 1;
      width: 32px; height: 32px; border-radius: 8px; cursor: pointer; display: none;
    }
    .busca .limpar:hover { background: var(--fundo); }
    .filtros { display: inline-flex; background: #fff; border: 1.5px solid var(--borda-forte); border-radius: 10px; padding: 3px; }
    .filtros button {
      font: inherit; font-size: 13px; font-weight: 600; border: 0; background: none; color: var(--suave);
      padding: 8px 12px; border-radius: 7px; cursor: pointer; white-space: nowrap;
    }
    .filtros button.ativo { background: var(--azul); color: #fff; }
    .baixar {
      display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 10px;
      background: var(--grad-marca); color: #33230a; font-weight: 700; font-size: 13.5px; text-decoration: none;
      white-space: nowrap; box-shadow: 0 2px 8px rgba(232,78,39,.25);
    }
    .baixar:hover { filter: brightness(1.04); }
    .baixar svg { width: 17px; height: 17px; stroke: currentColor; stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .info-busca { max-width: 1100px; margin: 0 auto; padding: 0 20px 10px; font-size: 12.5px; color: var(--suave); }

    /* ── Planilha ── */
    .folha { max-width: 1100px; margin: 0 auto; padding: 4px 20px 60px; }
    .planilha {
      width: 100%; border-collapse: separate; border-spacing: 0; background: #fff;
      border: 1px solid var(--borda-forte); border-radius: 12px; overflow: hidden;
      box-shadow: 0 1px 2px rgba(14,26,43,.04), 0 8px 24px rgba(14,26,43,.06);
    }
    .planilha thead th {
      background: var(--azul); color: #fff; font-size: 12px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .05em; text-align: left; padding: 11px 14px; white-space: nowrap;
    }
    .planilha thead th + th { border-left: 1px solid rgba(255,255,255,.12); }
    .planilha td {
      padding: 0 14px; height: 46px; border-top: 1px solid var(--borda); vertical-align: middle;
    }
    .planilha td + td { border-left: 1px solid var(--borda); }
    .planilha tbody tr.pessoa:nth-of-type(even) td { background: var(--linha-par); }
    .planilha tr.pessoa:hover td { background: #fff8ec; }
    .col-check { width: 64px; text-align: center; padding: 0 !important; }
    .col-cod { width: 120px; }
    .col-hora { width: 96px; }
    .col-emp { width: 30%; }

    tr.grupo td {
      background: var(--grupo); height: 38px; font-weight: 700; color: var(--azul); font-size: 13px;
      border-top: 1px solid var(--borda-forte);
    }
    tr.grupo td span { font-weight: 500; color: var(--suave); margin-left: 8px; font-size: 12px; }
    tr.grupo .tudo-ok { color: var(--ok); font-weight: 700; }

    .nome { font-weight: 600; }
    .empresa { color: var(--suave); }
    .codigo { font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; font-size: 13.5px; letter-spacing: .06em; color: var(--texto); }
    .hora { color: var(--ok); font-weight: 600; font-size: 13px; }
    .col-st { width: 150px; }
    .selo {
      display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px;
      font-size: 12px; font-weight: 600; border: 1px solid transparent; white-space: nowrap;
    }
    .selo::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .st-confirmado { background: #e7f5ec; color: #15803d; border-color: #c3e5d0; }
    .st-enviado { background: #ecf3fa; color: #2d5c8f; border-color: #d3e2f2; }
    .st-pendente { background: #f1f5f9; color: #47586e; border-color: #e3eaf2; }
    .sub-st { display: none; }
    mark { background: #fde7b8; color: inherit; border-radius: 3px; padding: 0 1px; }

    /* linha marcada como presente */
    tr.pessoa.presente td { background: var(--ok-fundo) !important; }
    tr.pessoa.presente .nome { color: var(--ok); }

    /* Caixa de seleção grande, fácil de tocar */
    .tique { display: flex; align-items: center; justify-content: center; width: 100%; height: 46px; cursor: pointer; }
    .tique input { position: absolute; opacity: 0; pointer-events: none; }
    .tique .caixa {
      width: 26px; height: 26px; border-radius: 7px; border: 2px solid var(--borda-forte); background: #fff;
      display: grid; place-items: center; transition: all .15s;
    }
    .tique:hover .caixa { border-color: var(--laranja); }
    .tique input:focus-visible + .caixa { box-shadow: 0 0 0 3px rgba(247,173,64,.35); }
    .tique .caixa svg { width: 16px; height: 16px; stroke: #fff; stroke-width: 3.2; fill: none; opacity: 0; transform: scale(.6); transition: all .15s; }
    .tique input:checked + .caixa { background: var(--ok); border-color: var(--ok); }
    .tique input:checked + .caixa svg { opacity: 1; transform: scale(1); }
    .tique.salvando .caixa { opacity: .5; }

    .vazio { text-align: center; padding: 48px 20px; color: var(--suave); background: #fff; }
    .vazio b { display: block; color: var(--texto); font-size: 15px; margin-bottom: 4px; }

    /* Aviso flutuante */
    .toast {
      position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 30px); opacity: 0; z-index: 50;
      background: var(--azul); color: #fff; padding: 12px 18px; border-radius: 10px; font-weight: 600;
      box-shadow: 0 10px 30px rgba(0,0,0,.2); transition: all .25s; max-width: calc(100% - 32px); text-align: center;
    }
    .toast.ver { opacity: 1; transform: translate(-50%, 0); }
    .toast.ok { background: var(--ok); }
    .toast.erro { background: var(--erro); }

    .tela-erro { max-width: 520px; margin: 80px auto; padding: 32px; background: #fff; border-radius: 16px; text-align: center; border: 1px solid var(--borda); }
    .tela-erro h1 { font-size: 19px; color: var(--azul); margin: 0 0 8px; }
    .tela-erro p { color: var(--suave); margin: 0; }
    .carregando { text-align: center; padding: 60px 20px; color: var(--suave); }
    .rodape { text-align: center; font-size: 12px; color: var(--fraco); padding: 0 20px 30px; }
    .oculto { display: none !important; }

    @media (max-width: 720px) {
      .topo-int { padding: 12px 16px 14px; }
      .placar { text-align: left; width: 100%; }
      .ferr-int { padding: 10px 16px; }
      .info-busca, .folha { padding-left: 16px; padding-right: 16px; }
      .filtros { width: 100%; }
      .filtros button { flex: 1; }
      .col-hora, .planilha td.c-hora, .planilha th.c-hora { display: none; }
      .col-cod { width: 84px; }
      .planilha td { padding: 8px 10px; height: auto; }
      .planilha thead th { padding: 10px; }
      .col-check { width: 52px; }
      .tique { height: 52px; }
      /* empresa vai para baixo do nome no celular */
      .planilha th.c-emp, .planilha td.c-emp { display: none; }
      .sub-emp { display: block !important; font-size: 12px; color: var(--suave); font-weight: 400; }
      .planilha th.c-st, .planilha td.c-st { display: none; }
      .sub-st { display: block !important; margin-top: 4px; }
      .sub-st .selo { font-size: 11px; padding: 2px 8px; }
      .filtros { flex-wrap: wrap; }
      .baixar { width: 100%; justify-content: center; }
      .filtros button { flex: 1 1 40%; }
      .codigo { font-size: 12.5px; letter-spacing: .03em; }
    }
    .sub-emp { display: none; }
  </style>
</head>
<body>
  <header class="topo">
    <div class="topo-int">
      <img src="/logo-branco.png" alt="Mais Corporativo">
      <div class="ev"><b id="ev-nome">Credenciamento</b><span id="ev-info">Carregando…</span></div>
      <div class="placar">
        <div class="num"><span id="n-presentes">0</span> <small>de <span id="n-total">0</span> presentes</small></div>
        <div class="barra-prog"><div id="prog"></div></div>
      </div>
    </div>
  </header>

  <div class="ferramentas" id="ferramentas">
    <div class="ferr-int">
      <div class="busca">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="busca" type="search" placeholder="Buscar nome, empresa ou código" autocomplete="off" autocorrect="off" spellcheck="false">
        <button class="limpar" id="limpar" title="Limpar busca" aria-label="Limpar busca">×</button>
      </div>
      <div class="filtros" id="filtros">
        <button data-f="todos" class="ativo">Todos</button>
        <button data-f="ausentes">Não chegaram</button>
        <button data-f="presentes">Presentes</button>
        <button data-f="nao_confirmados">Não confirmaram</button>
      </div>
      <a class="baixar" id="baixar" href="#" title="Baixar a lista em Excel (.xlsx)">
        <svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>Baixar planilha</a>
    </div>
    <div class="info-busca" id="info-busca"></div>
  </div>

  <main class="folha" id="folha"><div class="carregando">Carregando lista de convidados…</div></main>
  <div class="rodape">Marque a caixa ao lado do nome quando a pessoa chegar. A lista se atualiza sozinha.</div>
  <div class="toast" id="toast"></div>

<script>
'use strict';
(function () {
  const token = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop() || '');
  const API = '/api/credenciamento/' + encodeURIComponent(token);
  let convidados = [];
  let filtro = 'todos';
  const salvando = new Set(); // ids com gravação em andamento (não sobrescrever no sincronismo)

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const CHECK = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

  function toast(msg, tipo) {
    const t = $('toast');
    t.textContent = msg; t.className = 'toast ver ' + (tipo || '');
    clearTimeout(toast._t); toast._t = setTimeout(() => { t.className = 'toast ' + (tipo || ''); }, 2600);
  }

  // Destaca o termo buscado ignorando acentos/maiúsculas
  function destacar(texto, termo) {
    if (!termo) return esc(texto);
    const n = norm(texto); const i = n.indexOf(termo);
    if (i < 0) return esc(texto);
    return esc(texto.slice(0, i)) + '<mark>' + esc(texto.slice(i, i + termo.length)) + '</mark>' + esc(texto.slice(i + termo.length));
  }
  const NOMES_STATUS = { confirmado: 'Confirmado', enviado: 'Convite enviado', pendente: 'Pendente' };
  const selo = s => '<span class="selo st-' + esc(s) + '">' + esc(NOMES_STATUS[s] || s) + '</span>';
  const codigoFmt = c => String(c || '').replace(/(\d{3})(?=\d)/g, '$1 ');

  async function chamar(url, opcoes) {
    const r = await fetch(url, Object.assign({ cache: 'no-store', headers: { 'Content-Type': 'application/json' } }, opcoes || {}));
    const dados = await r.json().catch(() => ({}));
    if (!r.ok) { const e = new Error(dados.erro || 'Falha de comunicação. Verifique a internet.'); e.status = r.status; throw e; }
    return dados;
  }

  function telaErro(msg) {
    $('ferramentas').classList.add('oculto');
    document.querySelector('.rodape').classList.add('oculto');
    $('ev-info').textContent = '';
    $('folha').innerHTML = '<div class="tela-erro"><h1>Lista indisponível</h1><p>' + esc(msg) + '</p></div>';
  }

  function placar() {
    const total = convidados.length;
    const pres = convidados.filter(c => c.presente).length;
    $('n-presentes').textContent = pres;
    $('n-total').textContent = total;
    $('prog').style.width = total ? (pres / total * 100) + '%' : '0';
  }

  function desenhar() {
    placar();
    const termoBruto = $('busca').value.trim();
    const termo = norm(termoBruto);
    const termoDig = termoBruto.replace(/\D/g, '');
    $('limpar').style.display = termoBruto ? 'block' : 'none';

    const visiveis = convidados.filter(c => {
      if (filtro === 'presentes' && !c.presente) return false;
      if (filtro === 'ausentes' && c.presente) return false;
      if (filtro === 'nao_confirmados' && c.situacao === 'confirmado') return false;
      if (!termo) return true;
      return norm(c.nome).includes(termo) || norm(c.empresa || 'convites individuais').includes(termo) ||
        (termoDig.length >= 3 && c.codigo.includes(termoDig));
    });

    $('info-busca').textContent = termo || filtro !== 'todos'
      ? (visiveis.length ? visiveis.length + (visiveis.length === 1 ? ' pessoa encontrada' : ' pessoas encontradas') : '')
      : '';

    if (!visiveis.length) {
      $('folha').innerHTML = '<div class="planilha vazio"><b>' +
        (termo ? 'Ninguém encontrado com “' + esc(termoBruto) + '”' : filtro === 'presentes' ? 'Ninguém marcado como presente ainda' : filtro === 'nao_confirmados' ? 'Todos os convidados confirmaram' : 'Todos já chegaram 🎉') +
        '</b>' + (termo ? 'Confira a grafia ou busque pelo sobrenome, empresa ou código.' : '') + '</div>';
      return;
    }

    // Totais por empresa (sobre a lista inteira, não só a filtrada)
    const totais = {};
    for (const c of convidados) {
      const k = c.empresa; totais[k] = totais[k] || { t: 0, p: 0 };
      totais[k].t++; if (c.presente) totais[k].p++;
    }

    let html = '<table class="planilha"><thead><tr>' +
      '<th class="col-check">✓</th><th>Nome</th><th class="col-emp c-emp">Empresa</th>' +
      '<th class="col-st c-st">Status</th><th class="col-cod">Código</th><th class="col-hora c-hora">Chegada</th></tr></thead><tbody>';
    let grupoAtual = null;
    for (const c of visiveis) {
      if (c.empresa !== grupoAtual) {
        grupoAtual = c.empresa;
        const t = totais[c.empresa];
        html += '<tr class="grupo"><td colspan="6">' + esc(c.empresa || 'Convites individuais') +
          '<span class="' + (t.p === t.t ? 'tudo-ok' : '') + '">' + t.p + ' de ' + t.t + ' presente' + (t.t === 1 ? '' : 's') + '</span></td></tr>';
      }
      html += '<tr class="pessoa' + (c.presente ? ' presente' : '') + '" data-id="' + c.id + '">' +
        '<td class="col-check"><label class="tique' + (salvando.has(c.id) ? ' salvando' : '') + '" title="' + (c.presente ? 'Desmarcar' : 'Marcar presença') + '">' +
          '<input type="checkbox" data-id="' + c.id + '"' + (c.presente ? ' checked' : '') + ' aria-label="Presença de ' + esc(c.nome) + '">' +
          '<span class="caixa">' + CHECK + '</span></label></td>' +
        '<td><span class="nome">' + destacar(c.nome, termo) + '</span><span class="sub-emp">' + destacar(c.empresa || 'Convite individual', termo) + '</span>' +
          '<span class="sub-st">' + selo(c.situacao) + '</span></td>' +
        '<td class="empresa c-emp">' + destacar(c.empresa || 'Convite individual', termo) + '</td>' +
        '<td class="c-st">' + selo(c.situacao) + '</td>' +
        '<td class="codigo">' + esc(codigoFmt(c.codigo)) + '</td>' +
        '<td class="hora c-hora">' + (c.presente ? esc(c.hora || '✓') : '') + '</td></tr>';
    }
    html += '</tbody></table>';
    $('folha').innerHTML = html;
  }

  async function marcar(id, presente) {
    const c = convidados.find(x => x.id === id);
    if (!c) return;
    if (!presente && !confirm('Desmarcar a presença de ' + c.nome + '?')) { desenhar(); return; }
    const antes = { presente: c.presente, hora: c.hora };
    c.presente = presente;
    c.hora = presente ? new Date().toTimeString().slice(0, 5) : '';
    salvando.add(id); desenhar();
    try {
      const r = await chamar(API + '/presenca', { method: 'POST', body: JSON.stringify({ convidado_id: id, presente }) });
      c.presente = r.presente; c.hora = r.hora;
      toast(presente ? '✓ ' + c.nome + ' — presente' : c.nome + ' desmarcado(a)', presente ? 'ok' : '');
      // Agiliza a próxima busca: o texto fica selecionado para já digitar o próximo nome
      const b = $('busca');
      if (presente && b.value && matchMedia('(pointer: fine)').matches) { b.focus(); b.select(); }
    } catch (e) {
      Object.assign(c, antes);
      toast(e.message, 'erro');
      if (e.status === 404 && /link/i.test(e.message)) telaErro(e.message);
    } finally {
      salvando.delete(id); desenhar();
    }
  }

  async function carregar(primeira) {
    try {
      const d = await chamar(API);
      const ev = d.evento;
      if (primeira) {
        document.title = 'Credenciamento — ' + ev.nome;
        $('ev-nome').textContent = ev.nome;
        const [a, m, dia] = String(ev.data_evento || '').split('-');
        $('ev-info').textContent = 'Lista de credenciamento · ' + (dia ? dia + '/' + m + '/' + a : '') +
          (ev.hora_evento ? ' às ' + ev.hora_evento : '') + (ev.local_nome ? ' · ' + ev.local_nome : '');
      }
      // Mantém o estado local de quem está sendo gravado agora
      const locais = new Map(convidados.filter(c => salvando.has(c.id)).map(c => [c.id, c]));
      const novos = d.convidados.map(c => locais.get(c.id) || c);
      // só redesenha se algo mudou (evita a tela "piscar" a cada sincronização)
      if (primeira || JSON.stringify(novos) !== JSON.stringify(convidados)) { convidados = novos; desenhar(); }
    } catch (e) {
      if (primeira || e.status === 404) telaErro(e.message);
    }
  }

  $('folha').addEventListener('change', e => {
    const cb = e.target.closest('input[type=checkbox][data-id]');
    if (cb) marcar(Number(cb.dataset.id), cb.checked);
  });
  let espera;
  $('busca').addEventListener('input', () => { clearTimeout(espera); espera = setTimeout(desenhar, 90); });
  $('busca').addEventListener('keydown', e => {
    if (e.key === 'Escape') { $('busca').value = ''; desenhar(); }
    // Enter com uma única pessoa encontrada (ainda ausente) marca a presença dela
    if (e.key === 'Enter') {
      const linhas = document.querySelectorAll('tr.pessoa');
      if (linhas.length === 1 && !linhas[0].classList.contains('presente')) marcar(Number(linhas[0].dataset.id), true);
    }
  });
  $('limpar').addEventListener('click', () => { $('busca').value = ''; desenhar(); $('busca').focus(); });
  $('filtros').addEventListener('click', e => {
    const b = e.target.closest('button[data-f]'); if (!b) return;
    filtro = b.dataset.f;
    document.querySelectorAll('#filtros button').forEach(x => x.classList.toggle('ativo', x === b));
    desenhar();
  });

  $('baixar').href = API + '/planilha';
  carregar(true);
  // Sincroniza com outros celulares da recepção e com o check-in por QR code
  setInterval(() => { if (!document.hidden && !salvando.size) carregar(false); }, 10000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) carregar(false); });
})();
</script>
</body>
</html>
